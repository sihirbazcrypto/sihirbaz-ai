name: Sihirbaz AI Market Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Piyasayı tara
        env:
          MIN_TURNOVER_USDT: '10000000'
          MAX_SYMBOLS_PER_EXCHANGE: '80'
          SCAN_CONCURRENCY: '12'
        run: node scripts/scan-market.mjs
      - name: Radar verisini kaydet
        run: |
          git config user.name "sihirbaz-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/radar.json
          git diff --cached --quiet || git commit -m "chore: radar verisini güncelle"
          git push
