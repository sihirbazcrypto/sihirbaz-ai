name: Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Scan Binance Futures
        run: node scripts/scan-market.mjs

      - name: Commit updated market data
        shell: bash
        run: |
          if git diff --quiet -- public/data/dashboard.json; then
            echo "Veri değişmedi, commit oluşturulmadı."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json
          git commit -m "chore: update market data"
          git push
